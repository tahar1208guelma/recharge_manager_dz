name: recharge_manager_dz
description: "Professional POS Telecom Recharge Manager for Algeria (Mobilis, Djezzy, Ooredoo) - Developed by VAST Solutions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  provider: ^6.1.2
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  sqflite_common_ffi_web: ^0.4.3
  ffi: ^2.1.3
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.3
  intl: any
  pdf: ^3.10.8
  printing: ^5.13.1
  qr_flutter: ^4.1.0
  uuid: ^4.4.0
  path_provider: ^2.1.3
  path: ^1.9.0
  csv: ^6.0.0
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
