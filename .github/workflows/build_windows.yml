name: Multi-Platform Build & Release (Windows, Android, macOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (.exe)
        run: flutter build windows --release

      - name: Download Visual C++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\installer\vcredist_x64.exe"

      - name: Install Inno Setup Compiler
        run: choco install innosetup --no-progress -y

      - name: Compile Windows Setup (.exe Installer)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\iscc.exe" windows\installer\recharge_manager_dz_setup.iss

      - name: Upload Windows Setup (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RechargeManagerDZ_v1.0_Windows_Setup
          path: dist/RechargeManagerDZ_v1.0_Windows_Setup.exe

  build-android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: RechargeManagerDZ_v1.0_Android_APK
          path: build/app/outputs/flutter-apk/app-release.apk

  build-macos:
    name: Build macOS Application
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: |
          flutter build macos --release
          cd build/macos/Build/Products/Release
          zip -r RechargeManagerDZ_macOS.zip recharge_manager_dz.app

      - name: Upload macOS Package
        uses: actions/upload-artifact@v4
        with:
          name: RechargeManagerDZ_v1.0_macOS
          path: build/macos/Build/Products/Release/RechargeManagerDZ_macOS.zip
