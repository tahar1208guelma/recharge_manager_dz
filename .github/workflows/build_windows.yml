name: Build Windows Release (.exe)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Executable (.exe)
        run: flutter build windows --release

      - name: Download Visual C++ Redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile "windows\installer\vcredist_x64.exe"

      - name: Setup Inno Setup Compiler
        uses: Min-Shar/setup-innosetup@v1

      - name: Compile Windows Setup (.exe Installer)
        run: |
          iscc windows\installer\recharge_manager_dz_setup.iss

      - name: Upload Windows Setup Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: RechargeManagerDZ_v1.0_Windows_Setup.exe
          path: dist/RechargeManagerDZ_v1.0_Windows_Setup.exe
